name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  # the "Require green CI" step reads check-runs for the commit being released
  checks: read

jobs:
  release:
    name: Test, build & publish to Maven Central
    # Linux publishes every target. Kotlin/Native cross-compiles the Apple klibs
    # (iOS, macOS, tvOS) from any host since 2.1, and kp1812 has no cinterop, so
    # nothing here needs Xcode; the swift-package job builds the XCFramework. This
    # is the shape kzstd verified against its 0.2.0: a Linux publish produced the same 14
    # artifacts Maven Central holds, Apple klibs included. What a Linux host
    # cannot do is *execute* the Apple test binaries; the "Require green CI"
    # step below is what keeps that guarantee.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION matches gradle.properties
        run: |
          VF="${{ steps.version.outputs.version }}"
          VG=$(grep -E "^VERSION_NAME=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ "$VF" != "$VG" ]; then
            echo "::error::VERSION ($VF) != gradle.properties VERSION_NAME ($VG)"
            exit 1
          fi
          echo "✓ version $VF"

          # The changelog is the third source. `getChangelog` does NOT fail when the
          # declared version has no section — it silently returns the most recent
          # released one, which would ship the PREVIOUS release's notes as this
          # release's body. Check the heading exists here instead.
          # awk, not grep -E: the version is a literal and its dots are ERE
          # wildcards. `index($0, v) == 1` is "this line starts with exactly
          # this string", with no escaping to get wrong.
          if ! awk -v v="## [$VF]" 'index($0, v) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VF]' section — run './gradlew patchChangelog' and commit it before releasing."
            exit 1
          fi
          echo "✓ CHANGELOG.md has a section for $VF"

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # CI does not run on tags, and workflow_dispatch can release any ref — so the
      # Apple *tests* (macOS-only, and the one thing this runner cannot do) are only
      # guaranteed if the commit being released already passed them on a branch.
      - name: Require green CI on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # The two macOS jobs: the Apple test binaries execute in the first, and the
          # full klib ABI dump (Apple targets included) is checked in the second.
          for JOB in \
            "Tests (macOS: macosArm64, iosSimulatorArm64, tvosSimulatorArm64)" \
            "ABI check (all targets, macOS)"; do
            ok=0
            for _ in $(seq 1 60); do
              # -f filters server-side: the unfiltered check-runs list is paginated,
              # so a client-side match can miss the job entirely and wait forever.
              if ! CONC=$(gh api -X GET \
                "repos/${{ github.repository }}/commits/$SHA/check-runs" \
                -f check_name="$JOB" --jq '.check_runs[0].conclusion // ""'); then
                echo "::warning::check-runs query failed; retrying"
                sleep 30
                continue
              fi
              case "$CONC" in
                success) echo "✓ $JOB passed on $SHA"; ok=1; break ;;
                "") echo "waiting for '$JOB' on $SHA…"; sleep 30 ;;
                *) echo "::error::'$JOB' concluded '$CONC' on $SHA — not releasing"; exit 1 ;;
              esac
            done
            if [ "$ok" != 1 ]; then
              echo "::error::timed out waiting for '$JOB' on $SHA"
              exit 1
            fi
          done

      - name: Build, test & API check (all targets)
        # On Linux this compiles every target and runs every test that can execute
        # here (JVM/JS/Wasm/linuxX64). The Apple test binaries are covered by the
        # CI guard above.
        run: ./gradlew build --stacktrace

      - name: Resolve tag state on origin
        id: tag_state
        run: |
          V="${{ steps.version.outputs.version }}"
          git fetch origin "refs/tags/v$V:refs/tags/v$V" 2>/dev/null || true
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release tag to origin
        if: github.event_name == 'workflow_dispatch' && steps.tag_state.outputs.exists == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"

      - name: Render release notes
        # The changelog section for this version IS the release notes. The
        # alternative — `generate_release_notes: true` — describes the release a
        # second time from commit titles, and the hand-written description and the
        # generated one then drift. `getChangelog` reads the same CHANGELOG.md the
        # version check above already proved has a section for this version.
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: |
          V="${{ steps.version.outputs.version }}"
          cat > release-notes.md <<EOF
          ## kp1812 v${V}

          Recommendation ITU-R P.1812 in pure Kotlin Multiplatform: point-to-area
          terrestrial propagation prediction, 30 MHz to 6 GHz, zero runtime dependencies.

          \`\`\`kotlin
          implementation("org.meshtastic:kp1812:${V}")
          \`\`\`

          ### Changes

          EOF
          # Capture first so a Gradle failure fails this step (a pipeline would hide
          # it — GitHub's default shell sets -e but not -o pipefail).
          NOTES=$(./gradlew --console=plain -q getChangelog --no-header --no-links)
          # `-q` silences task output, but Develocity still prints the build-scan URL
          # on its own line. `sed` rather than `grep -v`: grep exits 1 when it filters
          # everything, which would fail the step on an empty section.
          printf '%s\n' "$NOTES" \
            | sed -E '/^(Publishing build scan|https:\/\/community\.develocity\.cloud)/d' \
            >> release-notes.md
          echo "--- rendered release notes ---"
          cat release-notes.md

      - name: Stage signed artifacts locally
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Collect artifacts for attestation
        run: |
          mkdir -p maven-attestation
          find ~/.m2/repository/org/meshtastic/kp1812 -type f \
            \( -name "*.jar" -o -name "*.klib" -o -name "*.pom" -o -name "*.module" \) \
            -exec cp {} maven-attestation/ \;
          ls -lh maven-attestation/

      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: maven-attestation/*

      - name: Check Maven Central state
        # Probe whether v$VERSION is already on Maven Central; if so, skip publish
        # (Sonatype rejects re-uploads), so a retry after a partial release is safe.
        id: mc_check
        run: |
          V="${{ steps.version.outputs.version }}"
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://repo1.maven.org/maven2/org/meshtastic/kp1812-jvm/$V/kp1812-jvm-$V.pom")
          echo "Maven Central POM probe for v$V: HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: steps.mc_check.outputs.already_published == 'false'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md

  swift-package:
    name: XCFramework & Swift package manifest
    # SwiftPM takes a binaryTarget by URL and checksum, so the zip and the Package.swift
    # naming it are attached to the release together. Only macOS can link the frameworks.
    needs: release
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build the XCFramework
        run: ./gradlew assembleKp1812ReleaseXCFramework --stacktrace

      - name: Zip it and write Package.swift
        run: scripts/swift-package.sh "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Kp1812.xcframework.zip"

      - name: Attest the zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/swift-package/Kp1812.xcframework.zip

      - name: Attach to the release
        # --clobber replaces both files on a re-run, so the manifest's checksum always names
        # the zip next to it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${VERSION}" \
            build/swift-package/Kp1812.xcframework.zip \
            build/swift-package/Package.swift \
            --clobber
