# The metaspace ceiling is the point, not the heap size: without one the daemon does not
# report an OOM, it "will expire after the build after running out of JVM Metaspace",
# takes a test executor with it, and the task fails with zero test failures recorded.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Configuration cache (stable since Gradle 8.1; .parallel is still incubating in 9.7).
# Single-project build, so no org.gradle.isolated-projects: nothing to isolate.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Dokka 2.x requires explicit opt-in to its V2 Gradle plugin mode.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

